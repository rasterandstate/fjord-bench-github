name: bench

# Runs the same pinned workloads as rasterstate/fjord-actions on a
# github-hosted runner, using the upstream setup actions, and commits the
# cold/warm numbers to results/github.csv. The Fjord bench workflow fetches
# that CSV over the raw URL to fill the "GitHub Actions" column of its table.
#
# Scheduled an hour before the Fjord run so fresh numbers are waiting.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, ahead of the Fjord run at 08:00

permissions:
  contents: write

jobs:
  bench:
    # Self-hosted Linux runner in the rasterandstate org. Using self-hosted on
    # purpose: it sidesteps the org's github-hosted billing lock and measures
    # the GitHub Actions stack (runner + upstream setup-* actions) on the same
    # class of hardware as the Fjord runner, so the comparison is apples-to-
    # apples on hardware and isolates the action ecosystem.
    runs-on: [self-hosted, linux, X64]
    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain drives rustup, which a bare VM may not have.
      - name: ensure rustup
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "no rustup on PATH; installing"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          fi
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: measure all workloads
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p results
          printf 'workload,scenario,phase,seconds,runner_os,runner_arch,run_id,timestamp\n' > results/github.csv
          bash scripts/measure.sh rust results/github.csv
          bash scripts/measure.sh node results/github.csv
          bash scripts/measure.sh go   results/github.csv
          echo "---- results/github.csv ----"
          cat results/github.csv

      - name: commit the refreshed numbers
        run: |
          set -euo pipefail
          if git diff --quiet results/github.csv; then
            echo "no changes to publish"
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "Fjord Bench Bot"
          git add results/github.csv
          git commit -m "Refresh GitHub Actions bench numbers (run ${{ github.run_id }})"
          git push
